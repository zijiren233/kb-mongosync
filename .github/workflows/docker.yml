name: Tool image

on:
  push:
    branches: ["**"]
    tags:
      - "v*"
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  docker-prepare:
    name: Docker Prepare
    runs-on: ubuntu-latest
    outputs:
      meta-images: ${{ steps.meta-images.outputs.value }}
      image-tag: ${{ steps.meta-images.outputs.image-tag }}
      msver: ${{ steps.versions.outputs.default }}
      matrix: ${{ steps.versions.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # VERSION pins the default build (semver/chart tags follow it); the extra
      # list adds side-by-side mongosync builds selectable via image.tag
      # (override with the EXTRA_MONGOSYNC_VERSIONS repository variable).
      - name: Assemble mongosync version matrix
        id: versions
        env:
          EXTRA_MONGOSYNC_VERSIONS: ${{ vars.EXTRA_MONGOSYNC_VERSIONS || '"1.22.0", "1.21.0", "1.20.0", "1.19.0", "1.18.0", "1.17.0", "1.15.0", "1.14.0", "1.13.1"' }}
        run: |
          default="$(tr -d '[:space:]' < VERSION)"
          [ -n "$default" ] || { echo "VERSION file is empty" >&2; exit 1; }
          matrix="$(jq -nc --arg d "$default" --argjson e "[${EXTRA_MONGOSYNC_VERSIONS}]" '([$d] + $e) | unique')"
          echo "default=${default}" >> "$GITHUB_OUTPUT"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

      - name: Verify upstream tarballs exist for both architectures
        env:
          MATRIX: ${{ steps.versions.outputs.matrix }}
        run: |
          set -eux
          # amd64 ships an ubuntu2204 build; arm64 only ships an Amazon 2023 build
          for MSVER in $(jq -r '.[]' <<<"$MATRIX"); do
            for art in ubuntu2204-x86_64 amazon2023-arm64-arm64; do
              url="https://fastdl.mongodb.org/tools/mongosync/mongosync-${art}-${MSVER}.tgz"
              code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 60 -r 0-0 "$url" || echo 000)"
              [ "$code" = "206" ] || [ "$code" = "200" ] || {
                echo "upstream tarball not reachable (HTTP ${code}): ${url}" >&2
                exit 1
              }
            done
          done

      - name: Build image metadata inputs
        id: meta-images
        env:
          GHCR_REPOSITORY: ${{ github.repository }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY || secrets.DOCKERHUB_REPOSITORY }}
          DEFAULT_REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          image_tag="sha-${GITHUB_SHA::7}"
          if [ -n "$DOCKERHUB_REPOSITORY" ]; then
            case "$DOCKERHUB_REPOSITORY" in
              */*)
                dockerhub_repository="$DOCKERHUB_REPOSITORY"
                ;;
              *)
                dockerhub_repository="$DOCKERHUB_USERNAME/$DOCKERHUB_REPOSITORY"
                ;;
            esac
          elif [ -n "$DOCKERHUB_USERNAME" ]; then
            dockerhub_repository="$DOCKERHUB_USERNAME/$DEFAULT_REPOSITORY_NAME"
          fi
          {
            echo "image-tag=$image_tag"
            echo 'value<<EOF'
            echo "ghcr.io/$GHCR_REPOSITORY"
            if [ -n "$dockerhub_repository" ]; then
              echo "docker.io/$dockerhub_repository"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

  docker-build:
    name: Tool image build (${{ matrix.msver }})
    needs: docker-prepare
    strategy:
      fail-fast: false
      matrix:
        msver: ${{ fromJSON(needs.docker-prepare.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: docker/github-builder/.github/workflows/build.yml@v1
    with:
      runner: |
        default=ubuntu-24.04
        linux/arm=ubuntu-24.04-arm
        linux/arm64=ubuntu-24.04-arm
      distribute: true
      platforms: linux/amd64,linux/arm64
      output: ${{ github.event_name == 'push' && 'image' || 'local' }}
      push: ${{ github.event_name == 'push' }}
      build-args: |
        MSVER=${{ matrix.msver }}
      artifact-upload: false
      sign: ${{ github.event_name == 'push' && 'auto' || 'false' }}
      cache: true
      cache-mode: max
      cache-scope: kb-mongosync-image
      sbom: true
      set-meta-annotations: true
      set-meta-labels: true
      meta-labels: |
        org.opencontainers.image.title=kb-mongosync tool image
        org.opencontainers.image.description=mongosync bundled with the kb-mongosync runner for KubeBlocks MongoDB migrations
      meta-annotations: |
        org.opencontainers.image.title=kb-mongosync tool image
        org.opencontainers.image.description=mongosync bundled with the kb-mongosync runner for KubeBlocks MongoDB migrations
      meta-images: ${{ needs.docker-prepare.outputs.meta-images }}
      # every build carries a mongosync-<version> tag; release/semver/sha tags
      # belong to the default build only, so tags never race across the matrix
      meta-tags: |
        type=raw,value=mongosync-${{ matrix.msver }}
        type=ref,event=branch,enable=${{ matrix.msver == needs.docker-prepare.outputs.msver }}
        type=ref,event=pr,enable=${{ matrix.msver == needs.docker-prepare.outputs.msver }}
        type=ref,event=tag,enable=${{ matrix.msver == needs.docker-prepare.outputs.msver }}
        type=semver,pattern={{version}},enable=${{ matrix.msver == needs.docker-prepare.outputs.msver }}
        type=semver,pattern={{major}}.{{minor}},enable=${{ matrix.msver == needs.docker-prepare.outputs.msver }}
        type=raw,value=${{ needs.docker-prepare.outputs.image-tag }},enable=${{ matrix.msver == needs.docker-prepare.outputs.msver }}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
        ${{ (vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME) != '' && format('- registry: docker.io
          username: {0}
          password: {1}', vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME, secrets.DOCKERHUB_PASSWORD) || '' }}

  helm-release:
    name: Helm release
    needs: docker-build
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/helm.yml
    with:
      release-tag: ${{ github.ref_name }}
    secrets: inherit
