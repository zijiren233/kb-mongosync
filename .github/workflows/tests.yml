name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: chart values matrix
        run: tests/chart-matrix.sh
      - name: script behavior matrix
        run: tests/script-matrix.sh
