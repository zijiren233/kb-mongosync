apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kb-mongosync.fullname" . }}
  labels:
    {{- include "kb-mongosync.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "kb-mongosync.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "kb-mongosync.labels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or .Values.serviceAccount.create .Values.serviceAccount.name }}
      serviceAccountName: {{ .Values.serviceAccount.name | default (include "kb-mongosync.fullname" .) }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: mongosync
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion | default "latest" }}"
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: KUBECONFIG
              value: /tmp/.kube/config
            - name: KBMS_API_URL
              value: "http://127.0.0.1:{{ .Values.port }}"
            - name: KBMS_VERBOSITY
              value: {{ .Values.verbosity | quote }}
            - name: KBMS_PORT
              value: {{ .Values.port | quote }}
            {{- if .Values.source.uri }}
            - name: KBMS_SOURCE_URI
              valueFrom:
                secretKeyRef:
                  name: {{ include "kb-mongosync.fullname" . }}-conf
                  key: sourceUri
            {{- else }}
            - name: KBMS_SOURCE_NAMESPACE
              value: {{ .Values.source.namespace | quote }}
            - name: KBMS_SOURCE_CLUSTER
              value: {{ .Values.source.cluster | quote }}
            {{- with .Values.source.component }}
            - name: KBMS_SOURCE_COMPONENT
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.destination.uri }}
            - name: KBMS_DESTINATION_URI
              valueFrom:
                secretKeyRef:
                  name: {{ include "kb-mongosync.fullname" . }}-conf
                  key: destinationUri
            {{- else }}
            - name: KBMS_DESTINATION_NAMESPACE
              value: {{ .Values.destination.namespace | quote }}
            - name: KBMS_DESTINATION_CLUSTER
              value: {{ .Values.destination.cluster | quote }}
            {{- with .Values.destination.component }}
            - name: KBMS_DESTINATION_COMPONENT
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
          ports:
            - name: api
              containerPort: {{ .Values.port }}
          # mongosync binds its API to localhost only, so probes must exec
          # inside the container instead of using httpGet against the pod IP.
          # mongosync 1.16.0 serves its API only after a fixed 120s boot sleep.
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "curl -sf http://127.0.0.1:{{ .Values.port }}/api/v1/progress >/dev/null"]
            periodSeconds: 2
            failureThreshold: 360
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "curl -sf http://127.0.0.1:{{ .Values.port }}/api/v1/progress >/dev/null"]
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
