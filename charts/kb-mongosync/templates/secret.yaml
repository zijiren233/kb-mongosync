{{- if or .Values.source.uri .Values.destination.uri }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kb-mongosync.fullname" . }}-conf
  labels:
    {{- include "kb-mongosync.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.source.uri }}
  sourceUri: {{ . | quote }}
  {{- end }}
  {{- with .Values.destination.uri }}
  destinationUri: {{ . | quote }}
  {{- end }}
{{- end }}
