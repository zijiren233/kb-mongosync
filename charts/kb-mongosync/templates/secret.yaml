{{- if and .Values.source.uri .Values.destination.uri }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kb-mongosync.fullname" . }}-conf
  labels:
    {{- include "kb-mongosync.labels" . | nindent 4 }}
type: Opaque
stringData:
  sourceUri: {{ .Values.source.uri | quote }}
  destinationUri: {{ .Values.destination.uri | quote }}
{{- end }}
