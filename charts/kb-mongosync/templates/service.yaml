apiVersion: v1
kind: Service
metadata:
  name: {{ include "kb-mongosync.fullname" . }}
  labels:
    {{- include "kb-mongosync.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "kb-mongosync.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: api
      port: {{ .Values.port }}
      targetPort: api
