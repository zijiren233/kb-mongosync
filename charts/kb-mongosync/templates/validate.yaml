{{- range $name, $side := dict "source" .Values.source "destination" .Values.destination }}
{{- if $side.uri }}
{{- if not (or (hasPrefix "mongodb://" $side.uri) (hasPrefix "mongodb+srv://" $side.uri)) }}
{{- fail (printf "%s.uri must start with mongodb:// (got %q...)" $name (substr 0 10 $side.uri)) }}
{{- end }}
{{- else if or (not $side.namespace) (not $side.cluster) }}
{{- fail (printf "%s needs either uri or namespace+cluster" $name) }}
{{- end }}
{{- end }}
