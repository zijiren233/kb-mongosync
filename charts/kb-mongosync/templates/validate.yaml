{{- if and (or .Values.source.uri .Values.destination.uri) (not (and .Values.source.uri .Values.destination.uri)) }}
{{- fail "manual mode needs both source.uri and destination.uri" }}
{{- end }}
{{- range $name, $uri := dict "source.uri" .Values.source.uri "destination.uri" .Values.destination.uri }}
{{- if and $uri (not (or (hasPrefix "mongodb://" $uri) (hasPrefix "mongodb+srv://" $uri))) }}
{{- fail (printf "%s must start with mongodb:// (got %s)" $name $uri) }}
{{- end }}
{{- end }}
{{- if and (not .Values.source.uri) (or (not .Values.source.namespace) (not .Values.source.cluster) (not .Values.destination.namespace) (not .Values.destination.cluster)) }}
{{- fail "serviceAccount mode needs source.namespace/cluster and destination.namespace/cluster (or set both uris for manual mode)" }}
{{- end }}
