image:
  repository: ghcr.io/zijiren233/kb-mongosync
  tag: "mongosync-1.16.0"

nameOverride: ""

# Two configuration modes:
#   serviceAccount mode: set namespace+cluster for both sides; the pod uses its
#     ServiceAccount to discover replica set names, pod FQDNs and credentials
#     (requires serviceAccount.create and rbac.create)
#   manual mode: set uri for both sides; nothing is discovered in-cluster
source:
  uri: ""
  namespace: ""
  cluster: ""
  component: ""

destination:
  uri: ""
  namespace: ""
  cluster: ""
  component: ""

serviceAccount:
  create: true
  name: ""

rbac:
  create: true

imagePullSecrets: []
nodeSelector: {}
affinity: {}
tolerations: []

verbosity: INFO
port: 27180

resources:
  limits:
    cpu: "1"
    memory: 2Gi
  requests:
    cpu: 200m
    memory: 512Mi
