image:
  repository: ghcr.io/zijiren233/kb-mongosync
  # every release publishes one tag per mongosync version (1.13.1-1.22.0 today,
  # full list: EXTRA_MONGOSYNC_VERSIONS in .github/workflows/docker.yml)
  tag: "mongosync-1.16.0"

nameOverride: ""

# Two configuration modes:
#   serviceAccount mode: set namespace+cluster for both sides; the pod uses its
#     ServiceAccount to discover replica set names, pod FQDNs and credentials
#     (requires serviceAccount.create and rbac.create)
#   manual mode: set uri for both sides; nothing is discovered in-cluster
source:
  uri: ""
  namespace: ""
  cluster: ""
  component: ""

destination:
  uri: ""
  namespace: ""
  cluster: ""
  component: ""

serviceAccount:
  create: true
  name: ""

rbac:
  create: true

imagePullSecrets: []
nodeSelector: {}
affinity: {}
tolerations: []

verbosity: INFO
port: 27180
# Wired from the driver flag --no-embedded-verify: passes --disableVerification
# to mongosync so restarts and resumed syncs stay verification-free too.
disableVerification: false

resources:
  # mongosync memory scales with document size (copy buffers hold up to 10k
  # docs per partition; verified: 64KB docs OOMKilled a 2Gi limit and looped
  # the copy, stable at 6Gi copying 15GB). Limits are unset by default: a
  # misjudged cap crashloops the migration, while an uncapped pod is just the
  # first eviction candidate under node pressure. Set limits if your
  # environment requires them (LimitRange, admission policy).
  requests:
    cpu: 200m
    memory: 512Mi
