# Least-privilege baseline for kb-mongosync (auto mode).
# Generate a copy with concrete names:
#   ./kb-mongosync.sh --src-ns A --src-cluster X --dst-ns B --dst-cluster Y rbac > my-rbac.yaml
#
# clusters get/list          discover cluster, component, serviceVersion
# deployments/pods/services/secrets/configmaps get/list/watch   read release state
# secrets create/delete      inject the mongosync config Secret (configure)
# pods delete                restart the pod when the config changes
# pods/exec + portforward    probe primaries via mongosh, reach the API
# events get/list            troubleshooting
# Helm itself additionally needs install rights on deployments and services.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kb-mongosync-operator
  namespace: <namespace>
rules:
  - apiGroups: ["apps.kubeblocks.io"]
    resources: ["clusters"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods", "services", "secrets", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
  - apiGroups: [""]
    resources: ["pods/exec", "pods/portforward"]
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kb-mongosync-operator
  namespace: <namespace>
subjects:
  - kind: User
    name: <kc-user>   # see: kubectl auth whoami
roleRef:
  kind: Role
  name: kb-mongosync-operator
  apiGroup: rbac.authorization.k8s.io
